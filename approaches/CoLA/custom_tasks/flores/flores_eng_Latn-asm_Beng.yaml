task: flores_eng_Latn-asm_Beng
dataset_path: facebook/flores
dataset_name: eng_Latn-asm_Beng
test_split: dev
dataset_kwargs:
  trust_remote_code: true
output_type: generate_until
doc_to_text: "{{sentence_eng_Latn}} ="
doc_to_target: "{{sentence_asm_Beng}}"
metric_list:
  - metric: bleu
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "\n"
  max_gen_toks: 128
metadata:
  version: 1.0
